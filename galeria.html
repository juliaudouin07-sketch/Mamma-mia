<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            MAMMA MIA! 🌸
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="peliculas.html">Películas</a>
            <a href="personajes.html">Personajes</a>
            <a href="canciones.html">Canciones</a>
            <a href="galeria.html" class="activo">Galería</a>
            <a href="sobre-la-saga.html">Sobre la saga</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="galeria-contenido">

        <!-- TITULO -->

        <section class="galeria-titulo">

            <p>
                Reviví los momentos más icónicos de la saga.
            </p>

            <div class="detalle-titulo"></div>

        </section>


        <!-- CATEGORIAS -->

        <section class="filtros-galeria">

            <button class="filtro activo-filtro">TODAS</button>

            <button class="filtro">
                PELÍCULAS
            </button>

            <button class="filtro">
                DETRÁS DE CÁMARAS
            </button>

            <button class="filtro">
                PERSONAJES
            </button>

            <button class="filtro">
                EVENTOS
            </button>

        </section>


        <!-- FOTOS -->

        <section class="galeria-grid">

            <div class="foto-galeria foto-grande">
                <img
                    src="img/bailando.jpg"
                    alt="Escena de baile de Mamma Mia"
                    style="width:100%; height:100%; object-fit:cover; object-position:center 25%;"
                >
            </div>


            <div class="foto-galeria foto-grande">
                <img
                    src="img/navegando.jpg"
                    alt="Escena navegando en Mamma Mia"
                    style="width:100%; height:100%; object-fit:cover; object-position:center 20%;"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/wedding.jpg"
                    alt="Escena de boda de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/mom and daughter.jpeg"
                    alt="Madre e hija en Mamma Mia"
                >
            </div>


            <div class="foto-galeria foto-ancha">
                <img
                    src="img/mar.jpeg"
                    alt="El mar en Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/trio.jpg"
                    alt="Trío de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/bts.jpg"
                    alt="Detrás de cámaras de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/bts 2.jpeg"
                    alt="Detrás de cámaras de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/dance.jpeg"
                    alt="Escena de baile"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/songscene.jpeg"
                    alt="Escena musical de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/grecia.jpeg"
                    alt="Ciudad de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/elenco.jpeg"
                    alt="Personajes de Mamma Mia"
                >
            </div>


            <div class="foto-galeria">
                <img
                    src="img/calles.jpeg"
                    alt="Calles de Mamma Mia"
                >
            </div>

        </section>

    </main>


<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

    <button class="cerrar-lightbox" id="cerrar-lightbox">
        ×
    </button>

    <button class="flecha-lightbox flecha-izquierda" id="anterior">
        ‹
    </button>

    <img
        id="imagen-lightbox"
        src=""
        alt="Imagen ampliada"
    >

    <button class="flecha-lightbox flecha-derecha" id="siguiente">
        ›
    </button>

</div>


<script>

    const imagenesGaleria =
        document.querySelectorAll(".foto-galeria img");

    const lightbox =
        document.getElementById("lightbox");

    const imagenLightbox =
        document.getElementById("imagen-lightbox");

    const cerrarLightbox =
        document.getElementById("cerrar-lightbox");

    const botonAnterior =
        document.getElementById("anterior");

    const botonSiguiente =
        document.getElementById("siguiente");

    let imagenActual = 0;


    function mostrarImagen(indice) {

        imagenActual = indice;

        imagenLightbox.src =
            imagenesGaleria[imagenActual].src;

        imagenLightbox.alt =
            imagenesGaleria[imagenActual].alt;

    }


    imagenesGaleria.forEach(function(imagen, indice) {

        imagen.addEventListener("click", function() {

            mostrarImagen(indice);

            lightbox.classList.add("lightbox-activo");

        });

    });


    botonSiguiente.addEventListener("click", function(evento) {

        evento.stopPropagation();

        imagenActual++;

        if (imagenActual >= imagenesGaleria.length) {
            imagenActual = 0;
        }

        mostrarImagen(imagenActual);

    });


    botonAnterior.addEventListener("click", function(evento) {

        evento.stopPropagation();

        imagenActual--;

        if (imagenActual < 0) {
            imagenActual = imagenesGaleria.length - 1;
        }

        mostrarImagen(imagenActual);

    });


    cerrarLightbox.addEventListener("click", function(evento) {

        evento.stopPropagation();

        lightbox.classList.remove("lightbox-activo");

    });


    lightbox.addEventListener("click", function(evento) {

        if (evento.target === lightbox) {

            lightbox.classList.remove("lightbox-activo");

        }

    });


    document.addEventListener("keydown", function(evento) {

        if (!lightbox.classList.contains("lightbox-activo")) {
            return;
        }

        if (evento.key === "Escape") {

            lightbox.classList.remove("lightbox-activo");

        }

        if (evento.key === "ArrowRight") {

            imagenActual++;

            if (imagenActual >= imagenesGaleria.length) {
                imagenActual = 0;
            }

            mostrarImagen(imagenActual);

        }

        if (evento.key === "ArrowLeft") {

            imagenActual--;

            if (imagenActual < 0) {
                imagenActual = imagenesGaleria.length - 1;
            }

            mostrarImagen(imagenActual);

        }

    });

</script>

</body>

</html>
